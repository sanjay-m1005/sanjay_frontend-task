<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Assignment</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="#">
            My Website
        </a>

        <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link active" href="#">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Cards</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Contact</a>
                </li>

            </ul>

        </div>
    </div>
</nav>


<!-- ================= IMAGE CAROUSEL ================= -->

<div id="myCarousel" class="carousel slide" data-bs-ride="carousel">

    <div class="carousel-indicators">

        <button type="button" data-bs-target="#myCarousel"
            data-bs-slide-to="0" class="active"></button>

        <button type="button" data-bs-target="#myCarousel"
            data-bs-slide-to="1"></button>

        <button type="button" data-bs-target="#myCarousel"
            data-bs-slide-to="2"></button>

    </div>


    <div class="carousel-inner">

        <div class="carousel-item active">
            <img src="https://picsum.photos/id/1018/1200/400"
                 class="d-block w-100"
                 alt="Image 1">
        </div>

        <div class="carousel-item">
            <img src="https://picsum.photos/id/1015/1200/400"
                 class="d-block w-100"
                 alt="Image 2">
        </div>

        <div class="carousel-item">
            <img src="https://picsum.photos/id/1019/1200/400"
                 class="d-block w-100"
                 alt="Image 3">
        </div>

    </div>


    <button class="carousel-control-prev"
        type="button"
        data-bs-target="#myCarousel"
        data-bs-slide="prev">

        <span class="carousel-control-prev-icon"></span>

    </button>


    <button class="carousel-control-next"
        type="button"
        data-bs-target="#myCarousel"
        data-bs-slide="next">

        <span class="carousel-control-next-icon"></span>

    </button>

</div>


<!-- ================= CARDS ================= -->

<div class="container my-5">

    <h2 class="text-center mb-4">
        Our Cards
    </h2>

    <div class="row g-4">

        <!-- Card 1 -->

        <div class="col-lg-4 col-md-6">

            <div class="card h-100 shadow">

                <img src="https://picsum.photos/id/1025/500/300"
                     class="card-img-top"
                     alt="Card Image">

                <div class="card-body">

                    <h5 class="card-title">
                        Card One
                    </h5>

                    <p class="card-text">
                        This is the first Bootstrap card.
                    </p>

                    <button class="btn btn-primary">
                        Read More
                    </button>

                </div>

            </div>

        </div>


        <!-- Card 2 -->

        <div class="col-lg-4 col-md-6">

            <div class="card h-100 shadow">

                <img src="https://picsum.photos/id/1035/500/300"
                     class="card-img-top"
                     alt="Card Image">

                <div class="card-body">

                    <h5 class="card-title">
                        Card Two
                    </h5>

                    <p class="card-text">
                        This is the second Bootstrap card.
                    </p>

                    <button class="btn btn-success">
                        Read More
                    </button>

                </div>

            </div>

        </div>


        <!-- Card 3 -->

        <div class="col-lg-4 col-md-6">

            <div class="card h-100 shadow">

                <img src="https://picsum.photos/id/1040/500/300"
                     class="card-img-top"
                     alt="Card Image">

                <div class="card-body">

                    <h5 class="card-title">
                        Card Three
                    </h5>

                    <p class="card-text">
                        This is the third Bootstrap card.
                    </p>

                    <button class="btn btn-danger">
                        Read More
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- ================= FORM ================= -->

<div class="container my-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">
                    Contact Form
                </h2>

                <form>

                    <!-- Name -->

                    <div class="mb-3">

                        <label class="form-label">
                            Name
                        </label>

                        <input type="text"
                               class="form-control"
                               placeholder="Enter your name">

                    </div>


                    <!-- Email -->

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input type="email"
                               class="form-control"
                               placeholder="Enter your email">

                    </div>


                    <!-- Password -->

                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input type="password"
                               class="form-control"
                               placeholder="Enter your password">

                    </div>


                    <!-- Message -->

                    <div class="mb-3">

                        <label class="form-label">
                            Message
                        </label>

                        <textarea class="form-control"
                                  rows="4"
                                  placeholder="Enter your message"></textarea>

                    </div>


                    <!-- Checkbox -->

                    <div class="form-check mb-3">

                        <input class="form-check-input"
                               type="checkbox">

                        <label class="form-check-label">
                            I agree to the terms
                        </label>

                    </div>


                    <button type="submit"
                            class="btn btn-primary w-100">

                        Submit

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
