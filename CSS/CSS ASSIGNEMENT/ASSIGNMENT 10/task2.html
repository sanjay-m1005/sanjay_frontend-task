<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Cards</title>
    <link rel="stylesheet" href="assert/css/style2.css">
</head>
<body>

    <h1>Our Products</h1>

    <div class="product-container">

        <div class="product-card">
            <img src="assert/image/ajith" alt="Product 1">
            <h2>Wireless Headphones</h2>
            <p class="price">₹1,999</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="assert/image/kamal" alt="Product 2">
            <h2>Smart Watch</h2>
            <p class="price">₹2,499</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="assert/image/rajini" alt="Product 3">
            <h2>Bluetooth Speaker</h2>
            <p class="price">₹1,499</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="assert/image/sk" alt="Product 4">
            <h2>Gaming Mouse</h2>
            <p class="price">₹899</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="assert/image/suriya" alt="Product 5">
            <h2>Mechanical Keyboard</h2>
            <p class="price">₹2,199</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="assert/image/vijay" alt="Product 6">
            <h2>Power Bank</h2>
            <p class="price">₹799</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="assert/image/rajini" alt="Product 7">
            <h2>USB-C Charger</h2>
            <p class="price">₹699</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="assert/image/vijay" alt="Product 8">
            <h2>Laptop Stand</h2>
            <p class="price">₹1,099</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
