<!DOCTYPE html>
<html>
<head>
  <title>Display vs Visibility</title>
  <link rel="stylesheet" href="assert/css/style4.css">
</head>
<body>

  <h3>Display: none example</h3>
  <div class="box">Box 1 (normal)</div>
  <div class="box display-none">Box 2 (display:none)</div>
  <div class="box">Box 3 (normal)</div>

  <h3>Visibility: hidden example</h3>
  <div class="box">Box 4 (normal)</div>
  <div class="box visibility-hidden">Box 5 (visibility:hidden)</div>
  <div class="box">Box 6 (normal)</div>

</body>
