<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registration</title>
</head>
<body>
    <header>
        <center>
            <H1>REGISTRATION FORM </H1>

        </center>
    </header>
    <section>
        <div>
            <form action="">
                <label for="username">ENTER YOUR NAME</label>
                <input type="text" id="username" placeholder="enter your name" required>
                <br>

                <label for="age">ENTER YOUR AGE</label>
                <input type="number" id="age" placeholder="enter the age" min="18" max="30">
                <br>

                <label for="gender">GENDER</label>
                <input type="radio" id="gender" name="gender" value="male" required >male
                <input type="radio" id="gender" name="gender" value="female" required>female
                <input type="radio" id="gender" name="gender" value="other" required>other
                <br>

                <label for="email">ENTER THE EMAIL</label>
                <input type="email" id="email" placeholder="enter the mail">
                <br>
                <label for="password">ENTER YOUR PASSWORD</label>
                <input type="password" id="password">
                <br>

                <label for="mobile">ENTER THE MOBILE NUMBER</label>
                <input type="tel" id="mobile" name="mobile" minlength="10" maxlength="10" required>
                <br>

                <label for="birth">ENTER THE DATE OF BIRTH</label>
                <input type="date" id="birth" name="birth">
                <br>

                <label for="course">SKILLS</label>
                <input type="checkbox" id="course" name="course" value="HTML"> HTML
                <input type="checkbox" id="course" name="course" value="CSS">CSS
                <input type="checkbox" id="course" name="course" value="JS">JS
                <input type="checkbox" id="course" name="course" value="REACT">REACT
                <input type="checkbox" id="course" name="course" value="PYTHON">PYTHON
                <br>

                <label for="course"> COURSE</label>
                <select>
                    <option value=""disabled selected>select one</option>
                    <option value="full stack">full stack</option>
                    <option value="AML">AML</option>
                    <option value="ADS">ADS</option>
                    <option value="mern full stack">mern full stack</option>
                    
                </select>
                <br>
                <label for="address">ENTER THE ADRDESS</label>
                <textarea name="address" id="address"></textarea>
                <br>

                <label for="upload">UPLOAD A FILE</label>
                <input type="file" id="upload" name="upload" > 
                <br>

                <label for="submit"></label>
               <input type="submit" id="submit" name="submit">
               <input type="reset" id="submit" name="submit">
               <br>



            </form>
        </div>
    </section>
    
</body>
</html>
